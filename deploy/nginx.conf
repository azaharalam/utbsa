# /etc/nginx/sites-available/utbsa
#
# certbot rewrites this file when it installs the certificate, so run it
# after putting this in place, not before.

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # certbot fills in the redirect to 443 here.

    # Member photos are served straight off disk rather than through Node.
    location /uploads/ {
        alias /srv/utbsa/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # A photo upload should never be executable.
        location ~ \.(php|js|sh|py)$ { deny all; }
    }

    location /_next/static/ {
        alias /srv/utbsa/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Photos and CSV imports need room; the default 1M is not enough.
    client_max_body_size 12M;

    # Basic hardening. Nothing here is exotic.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
