# /etc/nginx/sites-available/utbsa-staging
#
# Password-protected, because a staging site indexed or stumbled upon is how
# somebody signs up in the wrong place.
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-staging utbsa
#   (store that password in Bitwarden)

server {
    listen 80;
    server_name test.utoledobsa.org;
    # certbot rewrites this to redirect to 443.

    auth_basic "UTBSA staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # Belt and braces alongside robots.txt.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /uploads/ {
        alias /srv/utbsa-staging/public/uploads/;
        location ~ \.(php|js|sh|py)$ { deny all; }
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 12M;
}
