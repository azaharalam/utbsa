services:
  db:
    image: postgres:16-alpine
    container_name: utbsa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: utbsa
      POSTGRES_PASSWORD: utbsa_dev_password
      POSTGRES_DB: utbsa
    ports:
      - "5432:5432"
    volumes:
      - utbsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utbsa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  utbsa_pgdata:
